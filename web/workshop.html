<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self'"><title>主题工坊</title><link rel="stylesheet" href="workshop.css"></head>
<link rel="stylesheet" href="confirm-dialog.css"><link rel="stylesheet" href="theme-library.css">
<body>
<div class="workshop-windowbar pywebview-drag-region"><span>主题工坊</span><div class="workshop-window-controls"><button id="workshop-minimize" title="最小化" aria-label="最小化" data-ui-icon="minimize"></button><button id="workshop-maximize" title="最大化 / 还原" aria-label="最大化或还原" data-ui-icon="maximize"></button><button id="workshop-close" title="关闭" aria-label="关闭" data-ui-icon="close"></button></div></div>
<div class="workshop-resize edge-w" data-edge="w"></div><div class="workshop-resize edge-e" data-edge="e"></div><div class="workshop-resize edge-s" data-edge="s"></div><div class="workshop-resize edge-nw" data-edge="nw"></div><div class="workshop-resize edge-ne" data-edge="ne"></div><div class="workshop-resize edge-sw" data-edge="sw"></div><div class="workshop-resize edge-se" data-edge="se"></div>
<header><div><h1>主题工坊</h1><p>按占位文案制作你的点歌室 · 预览使用模拟数据</p></div><div class="header-actions"><button id="copy-guide" title="复制完整制作要求和配置示例；AI无需源码即可制作可导入主题包">复制 AI 提示词</button><button id="new-theme">新建副本</button><button id="import-theme">导入主题包</button><button id="save-theme">保存</button><button id="apply-theme" class="primary">保存并应用</button><button id="export-theme">保存并导出</button></div></header>
<main><aside><label class="library-label">编辑已安装主题<select id="theme-library"><option value="">选择主题…</option></select></label><div class="library-actions"><button id="open-theme-directory">打开主题目录</button><button id="delete-theme" disabled>删除当前主题</button></div><div id="editor-fields"></div><details><summary>AI / 高级编辑：JSON</summary><p>直接粘贴 theme.json；素材须先通过图片按钮导入，或使用“导入主题包”。</p><textarea id="json-editor" spellcheck="false"></textarea><button id="load-json">将 JSON 载入草稿</button><button id="refresh-json">刷新 JSON</button></details><p class="help">制作规范：项目 docs/themes/README.md<br><span id="storage-path"></span></p></aside>
<div id="online-theme-modal" class="online-theme-modal hidden" role="dialog" aria-modal="true" aria-labelledby="online-theme-heading">
 <section class="online-theme-card"><div class="online-theme-heading"><div><h2 id="online-theme-heading">在线主题库</h2><p>同仓库发布 · 仅下载主题，不更新程序</p></div><button id="online-theme-close" aria-label="关闭在线主题库">关闭</button></div>
 <div class="online-theme-toolbar"><button id="online-theme-refresh">刷新主题库</button><span id="online-theme-status" role="status" aria-live="polite">点击刷新获取主题</span></div>
 <progress id="online-theme-progress" class="hidden" max="100" value="0" aria-label="主题下载进度"></progress>
 <p class="online-theme-notice">签名清单与完整主题包校验后安装，不自动应用；已有同ID主题会保留，新下载的主题另存为副本。</p>
 <div id="online-theme-list"></div><button id="online-theme-load" class="hidden">载入刚安装的主题</button>
 </section></div>
<section class="preview-area"><nav><button id="preview-main" aria-pressed="true">主界面</button><button id="preview-capture" aria-pressed="false">直播小窗</button><select id="preview-size" aria-label="预览尺寸"><option value="1180,780">1180 × 780</option><option value="920,600">920 × 600</option><option value="1440,900">1440 × 900</option></select><span id="dirty-state">未保存</span></nav><div id="preview-stage"><div id="preview-wrap"><iframe id="theme-preview" title="主题实时预览" sandbox="allow-scripts allow-same-origin" src="index.html?preview=1"></iframe></div></div><p class="preview-help">人物位置用左侧滑块调整；尺寸预览不修改真实窗口。保存草稿不会自动切换主窗口。</p><p id="status" role="status" aria-live="polite">正在加载主题工坊…</p></section></main>
<script src="icons.js"></script><script src="confirm-dialog.js"></script><script src="workshop-window.js"></script><script src="workshop.js"></script><script src="theme-library.js"></script></body></html>
